name: MLB Schedule Scraper
on:
  schedule:
    # 09:00 UTC = 05:00 ET (zomertijd) / 04:00 ET (wintertijd).
    # Op dat moment zijn ook de laatste westkust-avondwedstrijden (die rond
    # 01:00–02:00 ET aflopen) al helemaal klaar, en staat het programma van
    # de nieuwe Amerikaanse baseball-dag al vast.
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Uitslagen en programma scrapen
        run: python mlb_schedule_scraper.py
      - name: JSON bestand committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mlb_schedule.json
          git diff --staged --quiet || git commit -m "MLB schedule bijgewerkt: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
