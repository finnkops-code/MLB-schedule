name: MLB Schedule Scraper
on:
  schedule:
    # Draait om de 3 uur i.p.v. 1x per dag (was: '0 9 * * *', enkel om
    # 09:00 UTC). Bij een enkele dagelijkse run staat de JSON voor bijna de
    # hele rest van de dag een volledige Amerikaanse baseball-dag achter,
    # tot vlak vóór de volgende run — precies het "loopt een dag achter"
    # probleem dat hiermee wordt opgelost. Het script berekent "vandaag"/
    # "gisteren" toch al vers bij elke run (op basis van de actuele
    # Eastern Time), dus vaker draaien maakt de data alleen maar actueler,
    # zonder ergens negatieve bijwerkingen te hebben.
    - cron: '0 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Python instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Uitslagen en programma scrapen
        run: python mlb_schedule_scraper.py
      - name: JSON bestand committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mlb_schedule.json
          git diff --staged --quiet || git commit -m "MLB schedule bijgewerkt: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
